[project]
name = "mentor-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.20",
    "gspread>=6.0",
    "openai>=1.92",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
